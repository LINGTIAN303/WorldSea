[package]
name = "worldsmith-app"
version = "0.1.0"
description = "WorldSmith — 世界观构建工具"
authors = ["WorldSmith"]
edition = "2021"

[lib]
name = "worldsmith_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# custom-protocol：release 构建启用 tauri/custom-protocol，使 tauri 进入
# 生产模式（dev=false）→ 加载 frontendDist 而非 devUrl。
# 纯 cargo build（不带 --features custom-protocol）保持 dev 模式（devUrl）。
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worldsmith-core = { path = "../worldsmith-core", features = ["sqlite"] }
portable-pty = "0.9"
regex = "1"
# tokio: 扩展 features 支持 AgentRuntime（agent-runtime 依赖 full 异步运行时）
#   - sync: Mutex/RwLock
#   - time: 定时器
#   - macros: #[tokio::main]/#[tokio::test]
#   - rt: 多线程运行时
#   - rt-multi-thread: 多线程调度器
#   - fs: 文件 IO（read_file/write_file 工具会用）
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread", "fs"] }
thiserror = "2"
rusqlite = { version = "0.34", features = ["bundled"] }
keyring = "3"
walkdir = "2"
notify = { version = "6", features = ["macos_kqueue"] }

# ── Agent Runtime（阶段 1.5 接入）─────────────────────────
# agent-runtime: Rust Agent 编排框架（crates/agent-runtime/），提供：
#   - AgentLoop（ReAct 循环）
#   - ToolBus（工具注册/调用）
#   - GenaiBackend（genai LLM 通信层，启用 llm-genai feature）
#   - 编排事件（OrchestratorEvent/AgentEvent）
# 通过 Tauri 命令层暴露给前端 useAgentRust.ts
agent-runtime = { path = "../crates/agent-runtime", features = ["llm-genai"] }
# async-trait: agent-runtime 的 trait 使用 #[async_trait] 宏
async-trait = "0.1"
# chrono: AgentRegistry 时间戳（created_at）
chrono = { version = "0.4", features = ["serde"] }
# uuid: AgentEntry 的 message_id 生成
uuid = { version = "1", features = ["v4"] }
# tracing: commands/agent.rs 的结构化日志（debug!/info!/warn!）
tracing = "0.1"
# tracing-subscriber: 在 lib.rs run() 中初始化日志输出（fmt subscriber）
#   阶段 2.1 实测：CDP 自动化不可用，通过 stdout 日志诊断 Agent 通信链路
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Skills Store（Task 24 阶段2/4）──
# reqwest: 下载技能包 zip archive（blocking 模式配合 tauri 同步命令；rustls-tls 避免 OpenSSL 依赖）
# worldsmith-skills-store: 技能包校验/解压/本地导入的纯逻辑（无 Tauri 依赖，可独立单元测试）
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
zip = "2"
sha2 = "0.10"
worldsmith-skills-store = { path = "../worldsmith-skills-store" }
