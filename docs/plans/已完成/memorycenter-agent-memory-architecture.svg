<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 860" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .grid { stroke: #1e293b; stroke-width: 1; }
      .legend { fill: #94a3b8; font-size: 12px; }
      .title { fill: #e2e8f0; font-size: 20px; font-weight: bold; }
      .subtitle { fill: #64748b; font-size: 12px; }
      .box { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
      .boxhead { fill: #334155; rx: 10; }
      .boxtitle { fill: #e2e8f0; font-size: 14px; font-weight: bold; }
      .text { fill: #cbd5e1; font-size: 12px; }
      .text-dim { fill: #64748b; font-size: 11px; }
      .tag { fill: #0f172a; font-size: 10px; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-label { fill: #94a3b8; font-size: 11px; }
      .cyan { fill: #22d3ee; }
      .emerald { fill: #34d399; }
      .violet { fill: #a78bfa; }
      .amber { fill: #fbbf24; }
      .orange { fill: #fb923c; }
      .rose { fill: #fb7185; }
      .accent-stroke { stroke-width: 2.5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- background grid -->
  <rect class="bg" width="1080" height="860"/>
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="40" x2="1080" y2="40"/>
    <line x1="0" y1="80" x2="1080" y2="80"/>
    <line x1="0" y1="120" x2="1080" y2="120"/>
    <line x1="0" y1="160" x2="1080" y2="160"/>
    <line x1="0" y1="200" x2="1080" y2="200"/>
    <line x1="0" y1="240" x2="1080" y2="240"/>
    <line x1="0" y1="280" x2="1080" y2="280"/>
    <line x1="0" y1="320" x2="1080" y2="320"/>
    <line x1="0" y1="360" x2="1080" y2="360"/>
    <line x1="0" y1="400" x2="1080" y2="400"/>
    <line x1="0" y1="440" x2="1080" y2="440"/>
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="0" y1="520" x2="1080" y2="520"/>
    <line x1="0" y1="560" x2="1080" y2="560"/>
    <line x1="0" y1="600" x2="1080" y2="600"/>
    <line x1="0" y1="640" x2="1080" y2="640"/>
    <line x1="0" y1="680" x2="1080" y2="680"/>
    <line x1="0" y1="720" x2="1080" y2="720"/>
    <line x1="0" y1="760" x2="1080" y2="760"/>
    <line x1="0" y1="800" x2="1080" y2="800"/>
  </g>

  <!-- title -->
  <text class="title" x="40" y="30">MemoryCenter 召回集成架构</text>
  <text class="subtitle" x="40" y="52">WorldSea Agent 记忆后端 · MemoryAccessor 适配层方案</text>

  <!-- ===== Layer 1: AgentLoop / Orchestrator ===== -->
  <g>
    <rect class="box" x="240" y="80" width="600" height="82"/>
    <rect class="boxhead" x="240" y="80" width="600" height="30"/>
    <text class="boxtitle" x="260" y="100">AgentLoop / Orchestrator（ReAct 循环）</text>
    <circle cx="262" cy="126" r="5" class="cyan"/>
    <text class="text" x="276" y="130">with_memory(Arc&lt;dyn MemoryAccessor>)  ← 已有注入点，当前 Option=None</text>
  </g>

  <!-- arrow layer1 -> layer2 -->
  <line class="arrow" x1="540" y1="162" x2="540" y2="196"/>

  <!-- ===== Layer 2: crates/agent-memory (adapter) ===== -->
  <g>
    <rect class="box" x="240" y="200" width="600" height="150"/>
    <rect class="boxhead" x="240" y="200" width="600" height="30"/>
    <text class="boxtitle" x="260" y="220">crates/agent-memory（新增 · 适配层）</text>
    <text class="text-dim" x="260" y="240">MemoryCenterAccessor  implements MemoryAccessor</text>

    <!-- method boxes -->
    <rect class="box" x="256" y="252" width="150" height="40"/>
    <text class="text" x="266" y="268">recall</text>
    <text class="text-dim" x="266" y="282">检索长期记忆</text>

    <rect class="box" x="416" y="252" width="150" height="40"/>
    <text class="text" x="426" y="268">inject</text>
    <text class="text-dim" x="426" y="282">注入 system prompt</text>

    <rect class="box" x="576" y="252" width="150" height="40"/>
    <text class="text" x="586" y="268">archive</text>
    <text class="text-dim" x="586" y="282">会话消息归档</text>

    <rect class="box" x="256" y="300" width="150" height="36"/>
    <text class="text" x="266" y="322">get_archive_boundary</text>

    <rect class="box" x="416" y="300" width="150" height="36"/>
    <text class="text" x="426" y="322">load_chunk</text>

    <rect class="box" x="576" y="300" width="150" height="36"/>
    <text class="text" x="586" y="322">recall ↔ retrieve</text>
  </g>

  <!-- arrow layer2 -> layer3 -->
  <line class="arrow" x1="540" y1="350" x2="540" y2="384"/>

  <!-- ===== Layer 3: crates/vendor (vendorized core) ===== -->
  <g>
    <rect class="box" x="240" y="388" width="600" height="120"/>
    <rect class="boxhead" x="240" y="388" width="600" height="30"/>
    <text class="boxtitle" x="260" y="408">crates/vendor（vendor 复制 · 独立演进）</text>
    <text class="text-dim" x="260" y="428">MemoryCenter 核心逻辑，从此随 WorldSea 独立分叉</text>

    <rect class="box" x="256" y="444" width="280" height="50"/>
    <circle cx="268" cy="466" r="5" class="violet"/>
    <text class="text" x="282" y="464">memory-center-core</text>
    <text class="text-dim" x="282" y="480">归档 / 淘汰 / 冲突检测 / 标签</text>

    <rect class="box" x="546" y="444" width="280" height="50"/>
    <circle cx="558" cy="466" r="5" class="violet"/>
    <text class="text" x="572" y="464">memory-center-core-logic</text>
    <text class="text-dim" x="572" y="480">检索 / 评分 / 记忆逻辑</text>
  </g>

  <!-- arrow layer3 -> layer4 -->
  <line class="arrow" x1="540" y1="508" x2="540" y2="542"/>

  <!-- ===== Layer 4: Storage trait (pluggable) ===== -->
  <g>
    <rect class="box" x="240" y="546" width="600" height="120"/>
    <rect class="boxhead" x="240" y="546" width="600" height="30"/>
    <text class="boxtitle" x="260" y="566">Storage trait（可插拔存储后端）</text>

    <!-- sqlite -->
    <rect class="box" x="256" y="588" width="170" height="64"/>
    <rect class="box" x="256" y="588" width="170" height="22" fill="#22d3ee" opacity="0.15"/>
    <text class="text" x="266" y="606">SqliteStorage</text>
    <text class="text-dim" x="266" y="622">当前选中</text>
    <text class="text-dim" x="266" y="636">rusqlite · 单二进制</text>

    <!-- localstorage -->
    <rect class="box" x="436" y="588" width="170" height="64"/>
    <rect class="box" x="436" y="588" width="170" height="22" fill="#fbbf24" opacity="0.15"/>
    <text class="text" x="446" y="606">LocalStorage</text>
    <text class="text-dim" x="446" y="622">文件树 · 待决策</text>
    <text class="text-dim" x="446" y="636">用户倾向 ✓</text>

    <!-- cached -->
    <rect class="box" x="616" y="588" width="210" height="64"/>
    <rect class="box" x="616" y="588" width="210" height="22" fill="#a78bfa" opacity="0.15"/>
    <text class="text" x="626" y="606">CachedStorage</text>
    <text class="text-dim" x="626" y="622">moka 缓存包装</text>
    <text class="text-dim" x="626" y="636">叠加于任意后端</text>
  </g>

  <!-- ===== Right side: external MemoryCenter (source) ===== -->
  <g>
    <rect class="box" x="60" y="388" width="150" height="120" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text class="text" x="82" y="416">D:\本地化AI\</text>
    <text class="text" x="82" y="434">MemoryCenter</text>
    <text class="text-dim" x="82" y="456">外部独立演进项目</text>
    <text class="text-dim" x="82" y="472">（复制来源）</text>
    <text class="text-dim" x="82" y="488">Core + Core-Logic</text>
  </g>
  <line x1="210" y1="472" x2="240" y2="472" class="arrow" stroke="#fb923c" stroke-dasharray="6 4"/>
  <text class="arrow-label" x="186" y="440">vendor</text>
  <text class="arrow-label" x="186" y="452">复制</text>

  <!-- ===== Bottom: legend ===== -->
  <g transform="translate(40, 720)">
    <text class="legend" x="0" y="0">图例</text>
    <circle cx="10" cy="22" r="5" class="cyan"/>
    <text class="text-dim" x="24" y="26">调用层（零改动）</text>
    <circle cx="160" cy="22" r="5" class="emerald"/>
    <text class="text-dim" x="174" y="26">适配层（新增）</text>
    <circle cx="300" cy="22" r="5" class="violet"/>
    <text class="text-dim" x="314" y="26">vendor 复制核心</text>
    <circle cx="460" cy="22" r="5" class="amber"/>
    <text class="text-dim" x="474" y="26">可插拔存储</text>
    <circle cx="600" cy="22" r="5" class="orange"/>
    <text class="text-dim" x="614" y="26">外部来源</text>
  </g>

  <!-- ===== Bottom: phase strip ===== -->
  <g transform="translate(40, 780)">
    <text class="legend" x="0" y="0">阶段路线</text>
    <text class="text-dim" x="0" y="24">阶段0 vendor复制 → 阶段1 适配层 → 阶段2 注入 → 阶段3 验证 → 阶段4 前端迁移 → 阶段5 清理</text>
    <rect x="0" y="34" width="18" height="8" rx="2" fill="#34d399"/>
    <text class="text-dim" x="24" y="42">当前处于阶段 0</text>
  </g>
</svg>