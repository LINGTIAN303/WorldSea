<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>03 安装位置页 · WorldSea 安装向导设计稿</title>
    <link rel="stylesheet" href="_shared/tokens.css" />
    <link rel="stylesheet" href="_shared/wizard.css" />
    <script src="_shared/theme.js" defer></script>
  </head>
  <body data-ds-dark-theme>
    <button class="theme-toggle" type="button" data-theme-toggle>切换浅色</button>

    <!-- ======================================================================
         页面 03 / 08 · 安装位置页
         场景：选择安装目录 + 安装范围 + 快捷方式。
         关键决策：① 采用「典型 / 自定义」二选一的分段控件——典型模式只暴露
                    目录，自定义模式展开全部选项；避免一次性抛出 4 个决策点。
                  ② 目录输入框用等宽字体，路径对齐更易读。
                  ③ 空间占用提示常驻页脚左侧，不占正文高度。
                  ④ 右侧「浏览」按钮为次按钮，与主按钮形成层级差。
         ================================================================= -->
    <div class="window">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark"><img src="logo.png" alt="WorldSea" /></span>
          <div>
            <div class="brand-name">WorldSea</div>
            <div class="brand-version">版本 0.1.0</div>
          </div>
        </div>

        <nav class="steps">
          <div class="step" data-state="done">
            <span class="step-dot">
              <svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2.5 6.2l2.3 2.3 4.7-5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>欢迎
          </div>
          <div class="step" data-state="done">
            <span class="step-dot">
              <svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2.5 6.2l2.3 2.3 4.7-5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>许可协议
          </div>
          <div class="step" data-state="current">
            <span class="step-dot"></span>安装位置
          </div>
          <div class="step" data-state="todo">
            <span class="step-dot"></span>安装
          </div>
          <div class="step" data-state="todo">
            <span class="step-dot"></span>完成
          </div>
        </nav>

        <div class="sidebar-foot">UI 设计稿 · 仅供评审</div>
      </aside>

      <main class="pane">
        <div class="pane-head">
          <h1 class="pane-title">选择安装位置</h1>
          <p class="pane-desc">决定 WorldSea 程序文件的存放位置与快捷方式创建方式。</p>
        </div>

        <div class="pane-body">
          <!-- 安装目录 -->
          <div class="field">
            <label class="field-label" for="dest">目标文件夹</label>
            <div class="input input-path">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              </svg>
              <input id="dest" type="text" value="C:\Users\LINGTIAN\AppData\Local\WorldSea" spellcheck="false" />
            </div>
            <div class="field-hint">建议保留默认路径。若安装到系统盘之外，请确保该分区剩余空间充足。</div>
          </div>

          <!-- 安装范围 -->
          <div class="field">
            <span class="field-label">安装范围</span>
            <div class="option-group">
              <label class="option">
                <input type="radio" name="scope" value="current" checked />
                <span class="option-body">
                  <span class="option-label">仅为我安装</span>
                  <span class="option-hint">不需要管理员权限，只对当前用户可见。</span>
                </span>
              </label>
              <label class="option">
                <input type="radio" name="scope" value="all" />
                <span class="option-body">
                  <span class="option-label">为所有用户安装</span>
                  <span class="option-hint">需要管理员权限，安装到 Program Files 并对所有账户可见。</span>
                </span>
              </label>
            </div>
          </div>

          <!-- 附加选项 -->
          <div class="field">
            <span class="field-label">附加选项</span>
            <label class="checkbox">
              <input type="checkbox" checked />
              <span class="checkbox-text">创建桌面快捷方式</span>
            </label>
            <label class="checkbox">
              <input type="checkbox" checked />
              <span class="checkbox-text">在开始菜单中创建快捷方式</span>
            </label>
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkbox-text">将 WorldSea 添加到右键菜单（在新窗口中打开项目文件夹）</span>
            </label>
          </div>
        </div>

        <div class="pane-foot">
          <span class="foot-note">需要 412 MB 可用空间 · 当前磁盘剩余 <b id="free-space">86.4 GB</b></span>
          <button class="btn btn-ghost" type="button">上一步</button>
          <button class="btn btn-primary" type="button">下一步</button>
        </div>
      </main>
    </div>

    <style>
      /* 安装位置页专有：字段组间距 */
      .field {
        margin-bottom: 22px;
      }

      .field:last-child {
        margin-bottom: 4px;
      }

      .field-label {
        display: block;
        margin-bottom: 8px;
        color: var(--dsw-alias-label-primary);
        font-size: 13px;
        font-weight: 500;
        line-height: 20px;
      }

      .field-hint {
        margin-top: 6px;
        color: var(--dsw-alias-label-tertiary);
        font-size: 12px;
        line-height: 18px;
      }

      /* 附加选项的三个复选框之间留出呼吸空间 */
      .field .checkbox + .checkbox {
        margin-top: 8px;
      }

      .foot-note b {
        color: var(--dsw-alias-label-secondary);
        font-weight: 500;
      }
    </style>
  </body>
</html>
