name: Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        有报错请贴**原始文本**，不要转述。截图请放 `docs/details/截图/` 后引用。

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 发生了什么
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 看到 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期 vs 实际
      placeholder: |
        预期：
        实际：
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: release 版本号或 git 提交号
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: 系统
      multiple: true
      options:
        - Windows 11
        - macOS
        - Linux
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 运行方式
      options:
        - 桌面应用（打包版）
        - 开发模式（pnpm dev）
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充
      description: 日志、截图、相关 issue
    validations:
      required: false
