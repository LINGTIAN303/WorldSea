name: CI

# 触发面：只在 main 上跑的话，长期开发分支（如 feat/*）的提交永远得不到校验——
# 本仓实际就是在 feat/ui-parallel 上开发，所以 push 用通配覆盖全部分支。
#
# 代价：分支同时存在 PR 时，push 与 pull_request 会对同一提交各起一个 run。
# 这个重复是刻意保留的，理由见下面的 concurrency 注释。
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# 最小权限：本流水线只读仓库内容，不需要写回任何东西。
# 显式声明而非依赖仓库默认值——默认值是仓库级设置，改了不会有任何提示。
permissions:
  contents: read

# 同一事件、同一分支的 run 归入同组：连续推送时新 run 取消旧 run，只有最新提交在跑。
#
# 分组键里带 event_name 是**刻意的**：push run 与 PR run 必须互不取消。
# 若让二者同组并在 PR 侧 cancel-in-progress，后启动的 push run 可能取消 PR run，
# 被取消的 run 会让分支保护要求的检查永远停在 pending——PR 再也合不了。
# 代价是分支有 PR 时同一提交会跑两遍；为消除它而删掉任一触发源都不划算：
# 删 push 通配 → 开发分支未开 PR 期间的提交完全失去校验（本仓曾因此 242 个提交零校验）；
# 删 pull_request → 分支保护的 PR 检查失去权威 run。
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ════════════════════════════════════════════════════════════════
  # 仓库门禁：架构 / fork 台账 / 样式一致性 / 文档链接 / 必需检查名一致性
  # 与本地 .githooks/pre-commit 跑同一套（scripts/gate.mjs），
  # 保证「本地过了 = CI 也过」，不会出现两套口径。
  # ════════════════════════════════════════════════════════════════
  gates:
    name: Repo Gates (arch / fork / style / docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fork:check 要 `git diff <基线提交>`，浅克隆取不到历史
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Repo gates
        run: pnpm gate

  # ════════════════════════════════════════════════════════════════
  # WASM 引擎（worldsea-core）：检查 + 测试
  # ════════════════════════════════════════════════════════════════
  wasm-core:
    name: WASM Core (worldsea-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 缓存 ~/.cargo 与 target：无缓存时每次全量编译，约 1.5 分钟纯等待
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worldsea-core
      - name: Install SQLite deps
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Cargo check
        run: cargo check --all-features
        working-directory: worldsea-core
      - name: Cargo test
        run: cargo test --features sqlite
        working-directory: worldsea-core

  # ════════════════════════════════════════════════════════════════
  # 前端（apps/tauri）：依赖安装 + 类型检查
  # ════════════════════════════════════════════════════════════════
  frontend:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck (apps/tauri)
        run: pnpm --filter @worldsea/tauri typecheck

  # ════════════════════════════════════════════════════════════════
  # 前端单元测试（vitest，全量）
  #
  # 此前 2400+ 个测试只在本地跑，CI 三项 job 都不覆盖：漏跑测试照样全绿，
  # 等于把「测试通过」的判定权完全交给本地自觉。本 job 把它变成可核验的远程事实。
  #
  # 覆盖范围以 vitest.config.ts 的 include 为准（packages/** + apps/tauri +
  # 两个 dsh 内置插件 + 壳注入脚本），不在本文件重复列举——两处维护必然漂移。
  # ════════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 两个 dsh 内置插件的 spec 依赖 dsh/vendor/schemastery 的构建产物
      # （lib/index.cjs，被 dsh/.gitignore 忽略），本 job 不构建 dsh。
      # vitest.config.ts 据「产物是否存在」自动跳过那 5 个文件——本地有产物时
      # 照常跑，此处无需特殊处理。
      #
      # 曾尝试在 CI 里补构建：需要 dsh 侧独立 workspace 安装 + cosmokit 前置 +
      # 根 tsdown 配置（该配置又依赖 typert/generator 的产物），越补越深。
      # 记为待办而非在此硬凑，详见 docs/details/架构/GitHub仓库配置现状与待办.md §3.2。
      #
      # 报告器用 dot：默认 reporter 会为每个测试打一行，2400+ 行日志把真正的
      # 失败信息淹掉。失败细节仍会完整输出在末尾。
      - name: Run vitest
        run: pnpm exec vitest run --reporter=dot

  # 注：桌面壳（apps/tauri/src-tauri）的编译验证依赖 Windows 桌面构建链，
  # 由本地构建（scripts/build-installer.ps1 / pnpm tauri:build）覆盖。
