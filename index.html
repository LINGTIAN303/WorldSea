<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>worldsmith</title>
    <!-- Theme Display Fonts: async loaded to avoid render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Bitter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Bitter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Bitter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" /></noscript>
  </head>
  <body>
    <!-- 静态启动页占位：零 JS 依赖，首帧立即可见，Vue SplashScreen 接管后自动移除 -->
    <div id="ws-splash-static">
      <div class="ws-static__inner">
        <div class="ws-static__title">WorldSmith</div>
        <div class="ws-static__tagline">Build Worlds. Shape Realities.</div>
        <div class="ws-static__bar"><div class="ws-static__bar-fill"></div></div>
        <div class="ws-static__version">v0.1.0-alpha</div>
      </div>
      <style>
        #ws-splash-static{
          position:fixed;inset:0;z-index:9999;
          background:radial-gradient(ellipse at 22% 28%,rgba(124,58,237,.10) 0%,transparent 60%),
                     radial-gradient(ellipse at 78% 55%,rgba(8,145,178,.07) 0%,transparent 60%),
                     linear-gradient(135deg,#0D0D0D 0%,#1C1917 50%,#17140F 100%);
          display:flex;align-items:center;justify-content:center;
          font-family:'Space Grotesk','DM Sans',system-ui,sans-serif;
          color:#fff;transition:opacity .4s ease;
        }
        .ws-static__inner{display:flex;flex-direction:column;align-items:center;gap:14px;animation:ws-static-in .6s ease}
        @keyframes ws-static-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
        .ws-static__title{font-size:64px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
          text-shadow:0 0 30px rgba(124,58,237,.4),0 0 60px rgba(124,58,237,.15)}
        .ws-static__tagline{font-size:15px;letter-spacing:.06em;color:#94A3B8;font-weight:400}
        .ws-static__bar{width:260px;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;margin-top:8px}
        .ws-static__bar-fill{height:100%;width:35%;background:linear-gradient(90deg,#7C3AED,#0891B2);border-radius:2px;
          box-shadow:0 0 12px rgba(124,58,237,.6);animation:ws-static-load 2.5s ease-in-out infinite}
        @keyframes ws-static-load{0%{width:10%}50%{width:65%}100%{width:90%}}
        .ws-static__version{font-size:10px;letter-spacing:.15em;color:#94A3B8;text-transform:uppercase;opacity:.5;margin-top:4px}
        @media(max-width:600px){.ws-static__title{font-size:42px}.ws-static__bar{width:200px}}
      </style>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
