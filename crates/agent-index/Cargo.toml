[package]
name = "agent-index"
version = "0.1.0"
edition = "2021"
description = "工作区文件检索索引（A2-2）：扫描 / 分块 / 混合检索（BM25-jieba + 向量 + RRF）"
license = "MIT OR Apache-2.0"
keywords = ["agent", "index", "search"]
categories = ["asynchronous"]

[lib]
crate-type = ["rlib"]

[dependencies]
# 统一语义供给面（A2-1：SemanticConfig 配置 + GatedEmbedder 熔断嵌入器 + ensure_vector_dim）
agent-memory = { path = "../agent-memory" }
# vendor 检索原语（BM25-jieba / SqliteVectorIndex / rrf_fusion / Embedder trait）
memory-center-core = { path = "../vendor/memory-center-core" }

# 索引库（元数据 + 块文本；向量经 SqliteVectorIndex 落同库）
rusqlite = { version = "0.32", features = ["bundled"] }
# 文件指纹 / workdir → 库名映射
sha2 = "0.10"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
