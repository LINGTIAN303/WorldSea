[package]
name = "agent-commands"
version = "0.1.0"
edition = "2021"
description = "Agent 命令层 — 主链路 14 命令 + 6 种编排模式命令的服务层（纯逻辑，Tauri 绑定在 tauri app 端）"
license = "MIT OR Apache-2.0"
keywords = ["agent", "command", "tauri", "ipc"]
categories = ["asynchronous"]

[lib]
crate-type = ["rlib"]

[dependencies]
# ── 本地 crate ──
# 启用 llm-genai：使 agent-runtime 的 GenaiBackend 可用（5.4 真实 LLM 接入）
agent-runtime = { path = "../agent-runtime", features = ["llm-genai"] }

# ── 序列化 ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── 异步运行时 ──
tokio = { version = "1", features = ["process", "sync", "macros", "rt", "time", "io-util"] }
async-trait = "0.1"

# ── 工具链 ──
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# 终端工具：清理命令输出中的 ANSI 转义码（对齐 TS 端 execute_command 行为）
regex = "1"
# 日志（上下文字段 span 等）
tracing = "0.1"

# ── 持久化（子 Agent 规格 SQLite 存储）──
# 与 agent-runtime 的可选 sqlite 特性对齐（sqlx 0.8 + runtime-tokio），
# 仅用于把子 Agent 规格以 JSON 整条存进 SQLite，应用重启后不丢失。
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"