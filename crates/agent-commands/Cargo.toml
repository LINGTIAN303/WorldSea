[package]
name = "agent-commands"
version = "0.1.0"
edition = "2021"
description = "Agent 命令层 — 主链路 14 命令 + 6 种编排模式命令的服务层（纯逻辑，Tauri 绑定在 tauri app 端）"
license = "MIT OR Apache-2.0"
keywords = ["agent", "command", "tauri", "ipc"]
categories = ["asynchronous"]

[lib]
crate-type = ["rlib"]

[dependencies]
# ── 本地 crate ──
# 启用 llm-genai：使 agent-runtime 的 GenaiBackend 可用（5.4 真实 LLM 接入）
agent-runtime = { path = "../agent-runtime", features = ["llm-genai"] }
# B 轨统一骨架（S1 适配层：编排双轨收拢试点 Plan-and-Execute 的直接执行引擎，经 agent_patterns::orchestrator）
agent-patterns = { path = "../agent-patterns" }
# MemoryAccessor 适配层（阶段 2：为会话注入 MemoryCenterAccessor）
agent-memory = { path = "../agent-memory" }
# MemoryCenter 核心（ArchiveConfig 归档阈值配置）
memory-center-core = { path = "../vendor/memory-center-core" }

# ── 序列化 ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── 异步运行时 ──
tokio = { version = "1", features = ["process", "sync", "macros", "rt", "time", "io-util"] }
async-trait = "0.1"

# ── PTY（P0 系统触达面：持久化 Shell 升级为真伪终端）──
portable-pty = "0.9"
anyhow = "1"

# ── PTY Windows passthrough（P2-1：PSEUDOCONSOLE_PASSTHROUGH_MODE 0x8 自研 backend）──
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
] }
downcast-rs = "1"

# ── 工具链 ──
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# 终端工具：清理命令输出中的 ANSI 转义码（对齐 TS 端 execute_command 行为）
regex = "1"
# 日志（上下文字段 span 等）
tracing = "0.1"

# ── 持久化（子 Agent 规格 SQLite 存储）──
# 与 agent-runtime 的可选 sqlite 特性对齐（sqlx 0.8 + runtime-tokio），
# 仅用于把子 Agent 规格以 JSON 整条存进 SQLite，应用重启后不丢失。
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"