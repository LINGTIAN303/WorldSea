[package]
name = "agent-patterns"
version = "0.1.0"
edition = "2021"
description = "Agent 编排扩展模式层 — 8 个扩展模式独立目录 + shared 共享类型，依赖 agent-kernel 底座契约"
license = "MIT OR Apache-2.0"
keywords = ["agent", "orchestrator", "llm", "ai", "编排"]
categories = ["asynchronous", "data-structures"]

[lib]
crate-type = ["rlib"]

[dependencies]
# 底座契约与资源服务（单向依赖：本 crate 只依赖 agent-kernel）
agent-kernel = { path = "../agent-kernel" }

# ── 序列化 ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── 异步运行时 ──
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
async-trait = "0.1"

# ── 工具链 ──
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = "s"
lto = true
