# memory-center-core（WorldSmith vendor 版）
# 来源：D:\本地化AI\MemoryCenter\crates\memory-center-core
# IO 实现层（SQLite / 文件树 / 缓存），与 MemoryCenter 项目分叉独立演进
# 已扁平化 workspace 依赖（WorldSmith 无根 workspace，各 crate 独立编译）

[package]
name = "memory-center-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "MemoryCenter 核心库 - Agent 记忆库核心（WorldSmith vendor 复制版）"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"
# 需 "time"（CrossProcessLockGuard::acquire）、fs/sync/io-util/rt（文件 IO / spawn_blocking）
tokio = { version = "1.0", features = ["time", "fs", "sync", "io-util", "rt"] }
# 双格式序列化 + SQLite 后端 + 细粒度锁
rmp-serde = "1.3"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
dashmap = "6.1"
# 高性能缓存（CachedStorage 装饰器）
moka = { version = "0.12", features = ["future"] }
# 中文分词（BM25 关键词检索）
jieba-rs = "0.7"
# 纯逻辑层（vendor 复制版）
memory-center-core-logic = { path = "../memory-center-core-logic" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.0"