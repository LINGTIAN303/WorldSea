# memory-center-models（WorldSea vendor 版）
# 来源：D:\本地化AI\MemoryCenter\crates\memory-center-models（上游 v2.56 代际）
# 变更：仅扁平化 workspace 依赖 + 说明注释；源码逐行保持上游原样
#   （唯一例外：sentencepiece 可选依赖未随迁，见文末 [features] 说明）
#
# 引入背景（A1 设计文档 §5.1「丙1 计量归一」）：
#   WorldSea 需要真实 token 计数来替换以「字节」为单位的错误量纲。
#   本 crate 提供编译期内嵌词表的 tiktoken 路径（离线可用、单二进制友好）
#   与 17 家族 × 30+ 型号的专家调校归档比率——是「理念回归」的载体，非外部引入。
#
# 上游设计原则（保持）：
#   - 家族（family）稳定、型号（variant）高频迭代，分离表达
#   - 重依赖（tiktoken-rs）仅隔离在本 crate，不污染 core / 装配层
#   - 未启用 tiktoken 时降级为 CharTokenizer（无依赖兜底）

[package]
name = "memory-center-models"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "MemoryCenter LLM 模型特配库 - 模型家族/型号/Tokenizer/架构特点（WorldSea vendor 复制版）"
license = "MIT"
keywords = ["llm", "tokenizer", "tiktoken", "model", "agent"]
categories = ["data-structures", "api-bindings"]

[lib]
crate-type = ["rlib"]

[dependencies]
# ── 序列化 ──
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"          # 上游保留（当前本 crate 未直接使用，随上游清单保持）

# ── 日志门面 ──
tracing = "0.1"

# ── Tiktoken 分词器（重依赖，隔离在此 crate）──
# 支持 o200k_base（GPT-4o/5）、cl100k_base（GPT-4/3.5）；Claude/DeepSeek 用系数近似
# 词表编译期内嵌（include_str!）→ 运行时不联网、单二进制部署
tiktoken-rs = "0.6"

# ── MemoryCenter 核心（仅用到 model::HARD_LIMIT_RATIO 一个常量）──
memory-center-core = { path = "../memory-center-core" }

[features]
default = []
# 上游可选：SentencePiece 分词器（用于 Gemini/Qwen/Llama 家族的中文精确计数）。
# WorldSea vendor 版**未携带** sentencepiece 依赖，原因：
#   1. 设计文档 §5.1 已裁定「仅限通过本地部署接入的模型」启用，而该能力还依赖
#      尚未建设的「每模型 vocab 路径」设施（上游用单个环境变量 MEMORY_CENTER_SPM_MODEL_PATH）；
#   2. 启用会为整条构建链引入 cmake + C++ 工具链（上游默认关闭同因）。
# 保留同名 feature 以免上游合并时冲突；启用会触发 lib.rs 中明确的编译错误提示。
tokenizer-sentencepiece = []
