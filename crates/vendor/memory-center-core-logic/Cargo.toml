# memory-center-core-logic（WorldSea vendor 版）
# 来源：D:\本地化AI\MemoryCenter\crates\memory-center-core-logic
# 纯逻辑 + Storage trait，与 MemoryCenter 项目分叉独立演进
# 已扁平化 workspace 依赖（WorldSea 无根 workspace，各 crate 独立编译）

[package]
name = "memory-center-core-logic"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "MemoryCenter 核心逻辑 - 纯逻辑 + Storage trait（WorldSea vendor 复制版）"
license = "MIT"

[features]
# 默认启用 native 模式（jieba 中文分词 + dashmap 并发锁）
default = ["native"]
native = ["dep:jieba-rs", "dep:dashmap"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"
# 仅 sync feature（不引入 fs/rt）
tokio = { version = "1.0", features = ["sync"] }
rmp-serde = "1.3"
# 可选中：native 模式启用（jieba 分词 + dashmap）
jieba-rs = { version = "0.7", optional = true }
dashmap = { version = "6.1", optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.0"