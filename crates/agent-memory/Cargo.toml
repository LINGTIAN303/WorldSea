[package]
name = "agent-memory"
version = "0.1.0"
edition = "2021"
description = "MemoryAccessor 适配层 — 以 vendor 的 memory-center-core 实现 Agent 长期记忆（recall/inject/archive）"
license = "MIT OR Apache-2.0"
keywords = ["agent", "memory", "accessor"]
categories = ["asynchronous"]

[lib]
crate-type = ["rlib"]

[dependencies]
# ── 本地 crate ──
# MemoryAccessor trait 与数据结构（来自 agent-runtime memory 模块）
agent-runtime = { path = "../agent-runtime" }
# MemoryCenter 核心（SQLite/文件树存储 + Retriefer + Archiver）
memory-center-core = { path = "../vendor/memory-center-core" }
# MemoryCenter 模型特配（A1 丙1：真实 token 分词器 + 窗口/归档比率专家值）
# 语义：与 memory-center-core 同族，属「原产地收编」而非外部引入
memory-center-models = { path = "../vendor/memory-center-models" }
# MemoryCenter LLM HTTP 客户端（A2 戊1：HttpEmbedder = OpenAI 兼容 /v1/embeddings；
# 同族原产地收编，reqwest 依赖隔离在该 crate 内）
memory-center-llm = { path = "../vendor/memory-center-llm" }

# ── 序列化 ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── 扩展库（memory_ext.db，A1 甲4）──
# 与 vendor/memory-center-core 同版本同 feature：bundled 统一由 libsqlite3-sys 提供，
# 最终二进制不会出现两份 SQLite（cargo feature 合并）。
rusqlite = { version = "0.32", features = ["bundled"] }

# ── 原文外置的内容坐标（A1 己1①）──
# sha256 前 16 位十六进制作为内容寻址坐标（同内容必同坐标 → 天然去重 + 可跨会话复用）
sha2 = "0.10"

# ── 异步运行时 ──
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
async-trait = "0.1"

# ── 工具链 ──
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"