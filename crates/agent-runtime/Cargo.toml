[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2021"
description = "Agent 编排框架 Rust 版 — Orchestrator/Node/State trait 抽象层"
license = "MIT OR Apache-2.0"
keywords = ["agent", "orchestrator", "llm", "ai", "编排"]
categories = ["asynchronous", "data-structures"]

[lib]
crate-type = ["rlib"]

[features]
default = []
# 阶段 1.2 启用：genai LLM 通信层
llm-genai = ["dep:genai"]
# 阶段 1.4 启用：SQLite 持久化
sqlite = ["dep:sqlx"]

[dependencies]
# ── 序列化 ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── 异步运行时 ──
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
async-trait = "0.1"
futures-util = "0.3"

# ── 工具链 ──
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# ── 可选依赖（阶段 1.2/1.4 启用）──
# genai: 关闭默认 rustls-tls（依赖 aws-lc-rs 编译），改用 native-tls
#   - Windows: schannel（系统自带，无需编译）
#   - Linux: OpenSSL（系统包管理器安装）
#   - macOS: SecureTransport（系统自带）
genai = { version = "0.7.0-beta.14", optional = true, default-features = false, features = ["native-tls"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = "s"
lto = true
