[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2021"
description = "Agent 编排框架聚合壳 — 转发 agent-kernel（底座）+ agent-patterns（扩展模式），保持对外路径 agent_runtime::xxx 兼容"
license = "MIT OR Apache-2.0"
keywords = ["agent", "orchestrator", "llm", "ai", "编排"]
categories = ["asynchronous", "data-structures"]

[lib]
crate-type = ["rlib"]

[features]
default = []
# 传导到 agent-kernel：genai LLM 通信层
llm-genai = ["agent-kernel/llm-genai"]
# 传导到 agent-kernel：SQLite 持久化
sqlite = ["agent-kernel/sqlite"]

[dependencies]
agent-kernel = { path = "../agent-kernel" }
agent-patterns = { path = "../agent-patterns" }

[profile.release]
opt-level = "s"
lto = true
