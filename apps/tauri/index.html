<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldSmith — 世界观构建工具</title>
    <!-- 防主题闪烁（批次98）：在 Vue 挂载前按 localStorage/system 立即设 data-theme，
         避免深色系统下启动白屏一帧。与 useTheme 三态模型同源（'light'|'dark'|'system'） -->
    <script>
      ;(function () {
        try {
          var v = localStorage.getItem('worldsmith:theme')
          var t =
            v === 'light' || v === 'dark'
              ? v
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = t
        } catch (e) {
          /* localStorage 不可用时保持默认浅色 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
