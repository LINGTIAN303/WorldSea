# WorldSea 壳的 dsh overlay（B4-a 建立，C1-b 扩充）
#
# 目的：把「web profile 默认值与壳内实际可行性」不一致的条目校正到壳的形态。
# 机制：用户补丁层覆盖 bundle 行（官方同款通道：`dsh web --patch <file>`；先例
#   dsh/apps/web/tests/pin-browse-picker.overlay.yml）。只改运行期装配，**不动 dsh 树**。
#
# 用法：壳 spawn 时带 `--patch <仓根>/apps/tauri/dsh-overlay.yml`（见 apps/tauri/src-tauri/src/dsh_shell.rs）
#
# 条目：
# 1) ui-sidebar-browser —— 打开 web profile 下默认禁用的「右栏内置浏览器」。
#    该条目随 bundle 发布，但 disabled 是按 profile 名判定的表达式
#    （packages/bundle/web-app/cordis.patch.yml：`ctx.get('profileContext')?.name !== 'desktop'`），
#    只有名叫 desktop 的 profile 才启用；desktop profile 由 Electron 壳独占（CLI 拒绝管理），
#    故这里覆盖 disabled 把它打开。
- id: ui-sidebar-browser
  disabled: false

# 2) client-hmr —— **已重开**（2026-11-04，G3）。
#    历史：C1-b（2026-09-24）曾关闭它，理由是 HMR 走 `/plugins/events` 的 SSE 长连，
#    而壳协议（worldsea://）的应答是缓冲体（Tauri UriSchemeResponder 只收 Cow<'static,[u8]>，
#    无流式写回通道）→ 必然 502 + EventSource 反复重连。
#    现在缺口已补：SSE 改走 Tauri 命令 + 管道流 lane（`dsh_sse.rs` / `dsh_sse_bridge.js`），
#    页面注入的 `__DSH_TRANSPORT__.fetch` 以 fetch 兼容形态提供原始 SSE 文本流，
#    client-hmr 优先走该分支（读 `response.body` 管道），不再落到 EventSource。
#    故这里放开 disabled，恢复上游默认行为。
- id: client-hmr
  disabled: false

# 3) workspace-controller —— E1（2026-09-25）：把「首次使用默认工作区」的候选目录钉到单一可见根。
#    该服务的 `documentsDirectory` 是「系统 Documents 的部署覆盖」；候选路径形状 = <documentsDirectory>/deepseek-harness/<leaf>。
#    壳 spawn 时显式导出 WORLDSEA_WORKSPACE（= 解析后的工作区，E1 起 = %USERPROFILE%\WorldSea）→ 候选落在根内；
#    未设该环境变量时保持 dsh 默认（Documents），不静默改变别处行为。
- id: workspace-controller
  config:
    documentsDirectory: !!js process.env.WORLDSEA_WORKSPACE

# 4) experimental-inspector —— 补 clientOrigins（2026-11-03）。
#    症状：页面控制台每次重载刷一条 `ws://127.0.0.1:<port>/ingest` 403（WebSocket handshake 失败）。
#    根因：inspector 的 ingest 握手只接受 loopback origin
#      （packages/experimental/inspector/src/worker/bridge/endpoint.ts 的 authorizedClient：
#       `localhost` / `127.0.0.1` / `[::1]`），而壳页面的 origin 是 **`http://worldsea.localhost`**
#      （wry 自定义协议 workaround 形态，见 docs/details/注释/tauri/dsh-bridge.md〔自定义协议落形〕）
#      → 不在白名单，直接 403。
#    官方 Electron 桌面端的页面 origin 就是 `http://127.0.0.1:<port>`，天然命中白名单，故上游无此问题；
#    这是「壳换掉载体后 origin 变了」的集成缺口，不是 inspector 的缺陷。
#    `clientOrigins` 是 inspector 官方提供的配置项（README「`/ingest` 额外接受的精确浏览器 origin」）。
#    注意：patch 的 config **整体替换**（见 app-boot/config-schema/document.ts：A patch config replaces
#    the whole config），故必须把 inspector-profile 原有的 `captureFetch: true` 一并写回。
- id: experimental-inspector
  config:
    captureFetch: true
    clientOrigins:
      - http://worldsea.localhost

# 5) session-log-deepseek —— 关掉会话日志上传（R3 隐私默认值，2026-11-05）。
#    上游默认 `enabled: true`：走官方 DeepSeek 模型 API 时，会把规范会话日志作为 `dsh_session_log`
#    请求字段增量上传。本仓的产品口径是「本机内容不外发」，故在装配层显式关闭并留证。
#    注意：patch 的 config **整体替换**（同第 4 条），故 `maxBytes` 必须一并写回默认值。
- id: session-log-deepseek
  config:
    enabled: false
    maxBytes: 8388608

# 6) session-telemetry-otel —— 关掉会话遥测导出（R3 隐私默认值，2026-11-05）。
#    上游默认 `mode: FEEDBACK_ONLY`（只在用户显式反馈时放行前缀），exporter 指向官方 collector。
#    本仓不参与该反馈通道，故整行停用；配置项无法停用一行（见 base 行注），只能落 `disabled`。
#    开关：删掉本条即恢复上游默认（排查或将来接反馈面时用）。
- id: session-telemetry-otel
  disabled: true
