[package]
name = "worldsmith-tauri-app"
version = "0.1.0"
description = "WorldSmith Tauri App — 桌面端"
authors = ["WorldSmith"]
edition = "2021"

# Phase 2 骨架：仅最小 Tauri 依赖
# Phase 3 将从 src-tauri/ 迁入完整命令层（agent/entity/file/git/pty 等）
[lib]
name = "worldsmith_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
