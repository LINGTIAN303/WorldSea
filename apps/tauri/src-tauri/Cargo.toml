[package]
name = "worldsmith-tauri-app"
version = "0.1.0"
description = "WorldSmith Tauri App — 桌面端"
authors = ["WorldSmith"]
edition = "2021"

# Phase 2 骨架：仅最小 Tauri 依赖
# Phase 3 将从 src-tauri/ 迁入完整命令层（agent/entity/file/git/pty 等）
[lib]
name = "worldsmith_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# 长任务命令参数（cmd_long_task_update_heartbeat / update_status 的 RFC3339 时间戳）
chrono = { version = "0.4", features = ["serde"] }

# ── Phase 5.1：Agent 命令层（纯逻辑，不依赖 tauri）──
agent-commands = { path = "../../../crates/agent-commands" }
# 命令签名中引用 agent-runtime 类型（AgentStateSnapshot / OrchestratorMessage / HeartbeatStatus）
# 启用 llm-genai：使 llm 模块（ProviderConfig）可被命令层引用（5.4 真实 LLM 接入）
agent-runtime = { path = "../../../crates/agent-runtime", features = ["llm-genai"] }
notify = "8.2.0"
