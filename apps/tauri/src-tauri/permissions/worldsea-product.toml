# D1-c（2026-09-24）：工作台窗口（产品域）命令面——按窗口授权的产品域命令族。
#
# 口径（见 docs/plans/2026-09-24-D1-产品域落位批计划.md §三 D1-c）：
# - 清单来源 = **构建产物可达性取证**（apps/tauri/workspace-dist 内出现的命令字面量）
#   ∩ **产品域源码引用**（apps/tauri/src + 仓根 packages/*，逐条判归属）；
# - Agent 面命令一律**不放**（会话/模型/长任务/循环控制/审批规则/凭证库/MCP/技能/语义检索）——
#   那属 dsh 窗（Agent 空间）的命令面，两侧按窗口互斥授权；
# - 授权面 = 仅工作台窗口（capabilities/workspace.json 的 windows 项）；dsh 窗（default.json）不含本权限；
# - 新增命令的动作：先在产物里确认可达（grep cmd_xxx apps/tauri/workspace-dist/assets/*.js），再加进本表。
# - **有意排除**（勿顺手补）：cmd_schema_get_entity_type · cmd_pattern_step_run ·
#   cmd_agent_tool_result · cmd_mcp_{spawn,kill,list} · cmd_skills_* · cmd_secure_* ·
#   cmd_semantic_* · cmd_workspace_index_*（面板随 AgentSpace 摘除而不可达）·
#   cmd_get_app_data_dir / cmd_get_home_dir / cmd_list_workdirs（Agent 侧路径助手）。
#
# 机制与应用级 ACL 的说明见 worldsea-shell.toml 头注。

[[permission]]
identifier = "allow-product-domain"
description = "产品域命令族（工作台窗口）：实体/关系/文件/KV 数据 + 文件系统 + 算法 + 校验 + 字体/LSP/预览 + 托盘与开机自启"
