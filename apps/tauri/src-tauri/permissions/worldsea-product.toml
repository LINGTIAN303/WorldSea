    "cmd_algo_astar", "cmd_algo_betweenness_centrality", "cmd_algo_chaikin_smooth", "cmd_algo_collision_check",
    "cmd_algo_community_detection", "cmd_algo_connected_components", "cmd_algo_constraint_solve", "cmd_algo_convex_hull",
