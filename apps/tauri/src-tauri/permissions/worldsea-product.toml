    "cmd_algo_dxf_generate", "cmd_algo_dxf_parse", "cmd_algo_find_intersections", "cmd_algo_find_line_polygon_intersections",
    "cmd_algo_find_shared_edges", "cmd_algo_force_layout", "cmd_algo_graph_analysis", "cmd_algo_hydraulic_erosion",
