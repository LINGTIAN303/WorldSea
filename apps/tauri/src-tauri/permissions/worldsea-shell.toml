# C3-a（2026-09-24）：壳侧命令面白名单（应用级 ACL）——页面可达的全部应用命令。
#
# 口径（见 docs/plans/2026-09-24-C3-壳侧安全面批计划.md §三 裁定 ①）：
# - 只放**页面实际在用**的 7 条（逐条 grep `dsh_shell_bridge.js` / `dsh_stream_bridge.js` 核过）；
# - 其余应用命令（旧 Agent 面全族）一律 ACL 拒；新增页面可调命令时在此逐条加 —— 每次都是可审计动作；
# - 机制：应用级 permissions 目录一旦存在，Tauri 即对**所有**应用命令执行 ACL（本地来源也不例外）——
#   tauri-2.11.5 `src/webview/mod.rs` 的 `has_app_acl_manifest` 分支。

[[permission]]
identifier = "allow-shell-bridge"
description = "壳桥：页面经 Tauri IPC 调用的壳能力（通知 / 系统浏览器 / 日志）"
commands.allow = ["cmd_notify", "cmd_shell_open_external", "cmd_shell_bridge_report"]

[[permission]]
identifier = "allow-stream-bridge"
description = "流桥：页面 openStream 钩子 → 管道 mux（开 / 上行 / 半关 / 取消）"
commands.allow = ["cmd_stream_open", "cmd_stream_send", "cmd_stream_end", "cmd_stream_cancel"]
