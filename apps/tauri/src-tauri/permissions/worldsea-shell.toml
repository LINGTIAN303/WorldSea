# C3-a（2026-09-24）：壳侧命令面白名单（应用级 ACL）——页面可达的全部应用命令。
#
# 口径（见 docs/plans/2026-09-24-C3-壳侧安全面批计划.md §三 裁定 ①）：
# - 只放**页面实际在用**的命令（逐条 grep `dsh_shell_bridge.js` / `dsh_stream_bridge.js` /
#   `dsh_workspace_notice.js` / `dsh_titlebar.js` 核过；C4-b 起 8 条，C6 起 10 条，D1-b 起 11 条）；
# - 其余应用命令（旧 Agent 面全族）一律 ACL 拒；新增页面可调命令时在此逐条加 —— 每次都是可审计动作；
# - 本权限为**两窗共用**的壳面（dsh 窗 + 工作台窗都在 capabilities 里引它）；
#   产品域命令族单列 worldsea-product.toml（仅工作台窗）；机制说明见下条。
# - 机制：应用级 permissions 目录一旦存在，Tauri 即对**所有**应用命令执行 ACL（本地来源也不例外）——
#   tauri-2.11.5 `src/webview/mod.rs` 的 `has_app_acl_manifest` 分支。

[[permission]]
identifier = "allow-shell-bridge"
description = "壳桥：页面经 Tauri IPC 调用的壳能力（通知 / 系统浏览器 / 日志 / 工作区权限修复 / 窗口栏动作与菜单 / 空间切换）"
commands.allow = [
    "cmd_notify",
    "cmd_shell_open_external",
    "cmd_shell_bridge_report",
    "cmd_fix_workspace_acl",
    "cmd_shell_window_action",
    "cmd_shell_popup_menu",
    "cmd_shell_space_switch",
    # E2（2026-09-24）：应用级偏好（主题）——产品页设置面板读写真源；dsh 页不调（其主题由设置通道驱动）
    "cmd_theme_get",
    "cmd_theme_set",
    # D3-a（2026-09-28）：产品域设置节——console 设置页（dsh 窗）读写，工作台页（快照门）读
    "cmd_product_prefs_get",
    "cmd_product_prefs_set",
    # D2 预设化走查批（2026-10-07）：/entity 就绪卡事实面——console 客户端贡献位（dsh 窗）调用；只读
    "cmd_product_briefing",
]

[[permission]]
identifier = "allow-stream-bridge"
description = "流桥：页面 openStream 钩子 → 管道 mux（开 / 上行 / 半关 / 取消）"
commands.allow = ["cmd_stream_open", "cmd_stream_send", "cmd_stream_end", "cmd_stream_cancel"]

[[permission]]
identifier = "allow-sse-bridge"
description = "SSE 流桥：页面 text/event-stream 订阅 → 管道流 lane（壳协议无流式通道，故另走命令）"
commands.allow = ["cmd_sse_open", "cmd_sse_close"]

[[permission]]
identifier = "allow-capability-bridge"
description = "能力桥（A，2026-09-25）：能力登记 / 内省 / 调用 / 回执——**两窗共用**（它本身就是两窗的缝）；调用 ACL 在 Rust 侧按窗口 label 判（提供方不可冒名、回执只认提供方）"
commands.allow = [
    "cmd_capability_register",
    "cmd_capability_list",
    "cmd_capability_invoke",
    "cmd_capability_result",
    "cmd_capability_unregister",
]
